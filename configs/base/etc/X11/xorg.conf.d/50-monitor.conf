# Xorg Configuration: Monitor and Display Settings
# Purpose: Configure monitor resolution, DPI, and multi-monitor setup
#
# This configuration file is automatically generated during installation
# based on detected monitor hardware. It ensures correct resolution,
# refresh rate, and DPI settings for optimal display quality.
#
# Applies to: All desktop environments using Xorg
#
# Monitor Configuration:
#   - Resolution: Native resolution of the display
#   - Refresh Rate: Preferred refresh rate (usually 60Hz)
#   - DPI: Dots per inch for font rendering
#   - Primary/Secondary: For multi-monitor setups
#   - Positioning: RightOf, LeftOf, Above, Below for multi-monitor
#
# HiDPI Support:
#   For high-resolution displays (4K, Retina, etc), the installer
#   automatically detects and configures appropriate DPI settings.
#   DisplaySize is specified in millimeters for accurate DPI calculation.
#
# Multi-Monitor Setup:
#   For systems with multiple monitors, the first monitor is marked as
#   Primary. Additional monitors can be positioned relative to the primary.
#
# References:
#   - Arch Wiki Xrandr: https://wiki.archlinux.org/title/Xrandr
#   - Arch Wiki HiDPI: https://wiki.archlinux.org/title/HiDPI
#   - Arch Wiki X Server: https://wiki.archlinux.org/title/X_server
#   - X.Org Monitor Configuration: https://www.x.org/wiki/Projects/XRandR/
#
# Note: This file is generated automatically by configure_xorg_display()
# during installation. Manual edits will be overwritten on reinstall.
# To customize, modify the DISPLAY_RESOLUTION selection during installation.

