# Xorg Configuration: Keyboard Layout
# Purpose: Configure keyboard layout and behavior for Xorg sessions
#
# This configuration applies the selected keyboard layout from the installer
# to Xorg, ensuring consistent keyboard behavior across all desktop environments.
#
# The layout is determined during installation via the KEYMAP variable and
# is automatically mapped to the appropriate XkbLayout and XkbVariant values.
#
# Applies to: All desktop environments using Xorg
#
# Keyboard Layout Mapping:
#   KEYMAP (console) → XkbLayout (Xorg)
#   us               → us
#   br-abnt2         → br (variant: abnt2)
#   de               → de
#   fr               → fr
#   uk               → gb
#   ... (see configure_xorg_keyboard() for full mapping)
#
# XKB Configuration Options:
#   XkbModel: Keyboard hardware model (e.g., pc104, pc105, laptop)
#             - pc104: Standard 104-key keyboard (US layout)
#             - pc105: Standard 105-key keyboard (European layout)
#             - laptop: Laptop keyboard
#   XkbLayout: Keyboard layout (e.g., us, de, fr, br)
#   XkbVariant: Layout variant (e.g., abnt2 for Brazilian ABNT2, dvorak)
#   XkbOptions: Additional options for keyboard behavior
#             - caps:escape - Remap Caps Lock to Escape
#             - caps:swapescape - Swap Caps Lock and Escape keys
#             - compose:ralt - Right Alt as Compose key
#             - compose:sclk - Scroll Lock as Compose key
#             - grp:shifts_toggle - Toggle layout with both Shift keys
#             - grp:caps_toggle - Toggle layout with Caps Lock
#             - grp:win_space_toggle - Toggle layout with Win+Space
#             - grp_led:caps - Caps Lock LED indicates layout
#
# References:
#   - Arch Wiki Keyboard Configuration: https://wiki.archlinux.org/title/Keyboard_configuration_in_Xorg
#   - Arch Wiki Compose Key: https://wiki.archlinux.org/title/Compose_key
#   - Arch Wiki X Keyboard Extension: https://wiki.archlinux.org/title/X_keyboard_extension
#   - X.Org XKB Documentation: https://www.x.org/wiki/XKB/
#
# Note: This file is generated automatically by configure_xorg_keyboard()
# during installation. Manual edits will be overwritten on reinstall.
# To customize, modify the KEYMAP selection during installation.

Section "InputClass"
    Identifier "keyboard"
    MatchIsKeyboard "on"
    Driver "libinput"
    Option "XkbModel" "pc104"
    Option "XkbLayout" "XKBLAYOUT_PLACEHOLDER"
    Option "XkbVariant" "XKBVARIANT_PLACEHOLDER"
    Option "XkbOptions" "caps:swapescape"
EndSection
