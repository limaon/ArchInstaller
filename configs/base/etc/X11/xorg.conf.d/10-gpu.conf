# Xorg Configuration: GPU Driver Configuration
# Purpose: Configure GPU driver for Xorg rendering
#
# This configuration file is automatically generated during installation
# based on detected GPU hardware. It ensures the correct driver is loaded
# for optimal graphics performance and compatibility.
#
# Applies to: All desktop environments using Xorg
#
# Supported GPUs:
#   - NVIDIA (proprietary driver)
#   - NVIDIA (open-source nouveau driver)
#   - AMD (amdgpu driver)
#   - Intel (intel or modesetting driver)
#   - Hybrid configurations (Intel + NVIDIA, AMD + Intel)
#
# GPU Detection:
#   The installer automatically detects your GPU using lspci and selects
#   the appropriate driver. Manual configuration is rarely needed.
#
# References:
#   - Arch Wiki NVIDIA: https://wiki.archlinux.org/title/NVIDIA
#   - Arch Wiki AMD: https://wiki.archlinux.org/title/AMD
#   - Arch Wiki Intel Graphics: https://wiki.archlinux.org/title/Intel_graphics
#   - Arch Wiki Nouveau: https://wiki.archlinux.org/title/Nouveau
#   - Arch Wiki NVIDIA Optimus: https://wiki.archlinux.org/title/NVIDIA_Optimus
#
# Note: This file is generated automatically by configure_xorg_gpu()
# during installation. Manual edits will be overwritten on reinstall.
# To customize, modify the GPU_DRIVER selection during installation.

# GPU_DRIVER_PLACEHOLDER
