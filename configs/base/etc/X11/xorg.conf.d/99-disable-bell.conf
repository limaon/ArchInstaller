# Xorg Configuration: Disable System Bell
# Purpose: Disables the audible bell (beep) on all input devices
#
# The system bell can be annoying in modern desktop environments, especially
# when pressing Backspace in empty password fields or other input validation
# scenarios. This configuration disables it globally via Xorg InputClass.
#
# Applies to: All desktop environments using Xorg
# Reason: User feedback - beep on Backspace in empty password field
#
# References:
#   - Arch Wiki Beep: https://wiki.archlinux.org/title/Beep
#   - Xorg InputClass: https://man.archlinux.org/man/xorg.conf.d.5
#   - Xorg Keyboard: https://man.archlinux.org/man/xorg.conf.5#KEYBOARD
#
# Note: This applies to Xorg sessions. Wayland sessions may require
# separate configuration in the display manager or desktop environment.
# For LightDM, we also use greeter-setup-script=/usr/bin/xset -b as backup.

Section "InputClass"
    Identifier "Disable Bell"
    Driver "libinput"
    Option "XkbOptions" "bell:off"
EndSection
