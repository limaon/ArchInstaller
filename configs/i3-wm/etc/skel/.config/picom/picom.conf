#################################
#          Picom Config          #
#   Compositor for i3-wm         #
# Based on ArchWiki:             #
# https://wiki.archlinux.org/    #
# title/Picom                    #
#################################

################################################################################
##  SHADOWS                                                                   ##
################################################################################

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.75;
shadow-offset-x = -10;
shadow-offset-y = -10;

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
    "class_g = 'i3bar'",
    "class_g = 'i3blocks'"
];

################################################################################
##  FADING                                                                    ##
################################################################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6;

################################################################################
##  OPACITY                                                                   ##
################################################################################

frame-opacity = 1.0;
inactive-opacity = 0.90;
active-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "85:class_g = 'URxvt' && focused",
    "70:class_g = 'URxvt' && !focused",
    "95:class_g = 'XTerm' && focused",
    "80:class_g = 'XTerm' && !focused",
    "95:class_g = 'Alacritty' && focused",
    "85:class_g = 'Alacritty' && !focused",
    "100:class_g = 'firefox'",
    "100:class_g = 'Chromium'",
    "100:class_g = 'Google-chrome'",
    "90:class_g = 'Dunst'"
];

################################################################################
##  BACKEND                                                                   ##
################################################################################

backend = "glx";
vsync = true;

################################################################################
##  WINDOW TYPE SETTINGS                                                      ##
################################################################################

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};

################################################################################
##  PERFORMANCE TUNING                                                        ##
################################################################################

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;

no-fading-openclose = false;
unredir-if-possible = true;
crop-shadow-to-monitor = true;
xrender-sync-fence = false;

################################################################################
##  BLUR                                                                      ##
################################################################################

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'firefox'",
    "class_g = 'Chromium'",
    "class_g = 'Google-chrome'",
    "class_g = 'i3bar'",
    "class_g = 'i3blocks'"
];

################################################################################
##  CORNER RADIUS                                                             ##
################################################################################

corner-radius = 8;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3bar'",
    "class_g = 'i3blocks'"
];

################################################################################
##  FOCUS EXCLUSION                                                           ##
################################################################################

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'",
    "class_g = 'Firefox' && argb"
];

################################################################################
##  LOGGING                                                                   ##
################################################################################

log-level = "warn";
log-file = "/tmp/picom.log";
write-pid-file = false;
daemon = false;
